{% extends "admin/base_site.html" %}

{% block content %}
<h1>Edit Policy Topic</h1>

<form method="post">
  {% csrf_token %}

  <table style="width:100%;max-width:1100px;">
    <tr>
      <td style="width:220px;padding:8px 0;"><label><b>Topic ID</b></label></td>
      <td><input type="text" name="topic_id" value="{{ row.topic_id|default:'' }}" style="width:100%;"></td>
    </tr>

    <tr>
      <td style="padding:8px 0;"><label><b>Topic (BN)</b></label></td>
      <td><input type="text" name="topic_bn" value="{{ row.topic_bn|default:'' }}" style="width:100%;"></td>
    </tr>

    <tr>
      <td style="padding:8px 0;"><label><b>Topic (EN)</b></label></td>
      <td><input type="text" name="topic_en" value="{{ row.topic_en|default:'' }}" style="width:100%;"></td>
    </tr>

    <tr>
      <td style="padding:8px 0;"><label><b>Clause Range</b></label></td>
      <td><input type="text" name="clause_range" value="{{ row.clause_range|default:'' }}" style="width:100%;"></td>
    </tr>

    <tr>
      <td style="padding:8px 0;"><label><b>Source File</b></label></td>
      <td><input type="text" name="source_file" value="{{ row.source_file|default:'' }}" style="width:100%;"></td>
    </tr>

    <tr>
      <td style="padding:8px 0;"><label><b>Domain</b></label></td>
      <td><input type="text" name="domain" value="{{ row.domain|default:'' }}" style="width:100%;"></td>
    </tr>

    <tr>
      <td style="padding:8px 0;"><label><b>Language</b></label></td>
      <td><input type="text" name="language" value="{{ row.language|default:'' }}" style="width:100%;"></td>
    </tr>

    <tr>
      <td style="padding:8px 0;"><label><b>Search EN</b></label></td>
      <td><textarea name="search_en" rows="3" style="width:100%;">{{ row.search_en|default:'' }}</textarea></td>
    </tr>

    <tr>
      <td style="padding:8px 0;vertical-align:top;">
        <label><b>Keywords BN</b><br><small>one per line</small></label>
      </td>
      <td><textarea name="keywords_bn" rows="8" style="width:100%;">{{ row.keywords_bn|default:'' }}</textarea></td>
    </tr>

    <tr>
      <td style="padding:8px 0;vertical-align:top;">
        <label><b>Keywords EN</b><br><small>one per line</small></label>
      </td>
      <td><textarea name="keywords_en" rows="8" style="width:100%;">{{ row.keywords_en|default:'' }}</textarea></td>
    </tr>

    <tr>
      <td style="padding:8px 0;"><b>Named Vector</b></td>
      <td>
        <input type="text" value="{{ vector_name }}" readonly style="width:100%;background:#f5f5f5;">
        <div style="margin-top:4px;color:#666;">If text changes, embedding will be regenerated automatically.</div>
      </td>
    </tr>

    <tr>
      <td style="padding:8px 0;vertical-align:top;"><label><b>Text</b></label></td>
      <td><textarea name="text" rows="16" style="width:100%;">{{ row.text|default:'' }}</textarea></td>
    </tr>

    <tr>
      <td></td>
      <td style="padding-top:14px;">
        <button type="submit" name="action" value="update" class="default">
          Update Topic
        </button>

        <button type="submit" name="action" value="reembed"
                style="margin-left:10px;background:#2c7be5;color:white;border:none;padding:8px 14px;">
          Update &amp; Re-Embed
        </button>

        <a href="{% url 'policy_topics_list' %}" style="margin-left:10px;">Back</a>
      </td>
    </tr>
  </table>
</form>

<hr style="margin:24px 0;">

<form method="post" action="{% url 'policy_topic_delete' row.topic_id %}" onsubmit="return confirm('Delete this topic?');">
  {% csrf_token %}
  <button type="submit" style="background:#b30000;color:#fff;border:none;padding:8px 14px;cursor:pointer;">
    Delete Topic
  </button>
</form>
{% endblock %}
