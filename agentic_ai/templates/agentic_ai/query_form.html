<section class="card query-card" aria-labelledby="query-title">
    <div class="query-heading"><span class="spark" aria-hidden="true">✧</span><h2 id="query-title">What would you like to know?</h2></div>
    <form id="agent-query-form" action="{% url 'agentic_ai:agentic_query_api' %}" method="post">
        {% csrf_token %}
        <label class="field-label" for="agent-message">Your question</label>
        <textarea id="agent-message" name="message" rows="3" maxlength="16000" required placeholder="Ask a question, find information, or describe what you need help with…" aria-describedby="query-hint"></textarea>
        <div class="composer-footer"><span class="composer-hint" id="query-hint">Add the details that matter.<br>Ctrl / ⌘ + Enter to run</span><button class="run-button" type="submit">Ask assistant &nbsp; →</button></div>
    </form>
    <section class="result-panel" aria-labelledby="result-title" aria-busy="false">
        <div class="result-heading"><h3 id="result-title">Your results</h3><div><button class="copy-button" id="copy-result" type="button" hidden>Copy full answer</button> <span class="status-badge" id="agent-status" data-state="idle">Ready when you are</span></div></div>
        <div class="result-empty" id="result-empty"><span class="empty-symbol" aria-hidden="true">⌁</span>A little context goes a long way.<br>Ask a question above to get started.</div>
        <pre class="result-text" id="agent-result" role="status" aria-live="polite" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
        <div class="report-toolbar" id="report-toolbar" hidden>
            <label class="sr-only" for="report-search">Find in displayed rows</label>
            <input class="report-search" id="report-search" type="search" placeholder="Find in displayed rows…" autocomplete="off" aria-controls="agent-table">
            <span class="search-count" id="search-count" role="status" aria-live="polite"></span>
            <button class="copy-button" id="expand-report" type="button" aria-controls="agent-table" aria-expanded="false">Expand table</button>
        </div>
        <div class="table-wrap" id="agent-table" tabindex="0" role="region" aria-label="Report data" hidden></div>
        <div class="result-details" id="agent-details"></div>
    </section>
</section>
<script>
(() => {
    const form = document.getElementById('agent-query-form');
    const result = document.getElementById('agent-result');
    const status = document.getElementById('agent-status');
    const tableWrap = document.getElementById('agent-table');
    const details = document.getElementById('agent-details');
    const copyButton = document.getElementById('copy-result');
    const panel = document.querySelector('.result-panel');
    const toolbar = document.getElementById('report-toolbar');
    const search = document.getElementById('report-search');
    const searchCount = document.getElementById('search-count');
    const expandButton = document.getElementById('expand-report');
    const labels = {MEMBERID:'Member ID',BRANCHCODE:'Branch code',BRANCHNAME:'Branch name',
        PRODUCTNAME:'Loan product',DISBURSE_AMOUNT:'Disbursed amount',DISBURSEDATE:'Disbursement date',
        MATURITYDATE:'Maturity date',OUTSTANDINGP:'Outstanding principal','Outstanding(P+I)':'Outstanding incl. interest',
        DUEAMOUNT:'Due amount',DUE_DAYS:'Overdue days',DUEINSTNO_U:'Overdue installments',
        INSTALLMENT_AMOUNT:'Installment amount',PAYMENTFREQUENCY:'Payment frequency',
        GS_BALANCE:'General savings',CS_BALANCE:'Compulsory savings'};
    search.addEventListener('input', () => {
        const term = search.value.trim().toLocaleLowerCase();
        const rows = [...tableWrap.querySelectorAll('tbody tr')];
        let visible = 0;
        rows.forEach(row => { row.hidden = !row.textContent.toLocaleLowerCase().includes(term); if (!row.hidden) visible++; });
        searchCount.textContent = visible + ' of ' + rows.length + ' displayed rows';
    });
    expandButton.addEventListener('click', () => {
        const expanded = tableWrap.classList.toggle('expanded');
        expandButton.setAttribute('aria-expanded', String(expanded));
        expandButton.textContent = expanded ? 'Collapse table' : 'Expand table';
    });
    let copyText = '';
    copyButton.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(copyText); copyButton.textContent = 'Copied'; }
        catch (_) { copyButton.textContent = 'Select result text to copy'; }
    });
    form.addEventListener('keydown', event => {
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
            event.preventDefault(); form.requestSubmit();
        }
    });
    form.addEventListener('submit', async function(event) {
        event.preventDefault();
        const button = form.querySelector('[type=submit]');
        if (button.disabled) return;
        const question = form.elements.message.value.trim();
        if (!question) return;
        button.disabled = true; form.elements.message.disabled = true;
        button.textContent = 'Working…'; status.dataset.state = 'working'; status.textContent = 'Request in progress';
        panel.setAttribute('aria-busy', 'true');
        document.getElementById('result-empty').hidden = true;
        tableWrap.hidden = true; tableWrap.replaceChildren(); tableWrap.classList.remove('expanded');
        toolbar.hidden = true; search.value = ''; searchCount.textContent = '';
        expandButton.setAttribute('aria-expanded', 'false'); expandButton.textContent = 'Expand table';
        details.textContent = ''; copyButton.hidden = true;
        result.textContent = 'Your request is running. Larger reports may take a few minutes.';
        const started = Date.now();
        const clock = setInterval(() => { details.textContent = 'Waiting for a response · ' + Math.floor((Date.now()-started)/1000) + 's elapsed'; }, 1000);
        try {
            const response = await fetch(form.action, {
                method: 'POST', credentials: 'same-origin',
                headers: {'Content-Type':'application/json', 'X-CSRFToken':form.querySelector('[name=csrfmiddlewaretoken]').value,
                    'Idempotency-Key':globalThis.crypto?.randomUUID?.() || String(Date.now())+'-'+Math.random().toString(36).slice(2)},
                body: JSON.stringify({message:question})
            });
            if (!(response.headers.get('content-type') || '').includes('application/json')) {
                throw new Error(response.status === 504
                    ? 'The proxy timed out. The backend may still be running; check the run log before retrying.'
                    : 'The server returned HTTP '+response.status+'. Check the run log before retrying.');
            }
            const body = await response.json();
            const answer = body.answer ?? body.error ?? 'No response was returned.';
            copyText = typeof answer === 'string' ? answer : JSON.stringify(answer,null,2);
            result.textContent = copyText;
            const report = body.raw?.structuredContent;
            if (body.ok && report && Array.isArray(report.columns) && report.columns.length && Array.isArray(report.rows)) {
                const table = document.createElement('table');
                const caption = document.createElement('caption'); caption.textContent = 'Returned report values'; caption.hidden = true; table.append(caption);
                const head = table.createTHead().insertRow();
                report.columns.forEach(column => { const th = document.createElement('th'); th.scope='col'; th.textContent=labels[column] || column.replace(/_/g,' '); th.title=column; head.append(th); });
                const tbody = table.createTBody();
                report.rows.forEach(row => {
                    const tr = tbody.insertRow();
                    report.columns.forEach(column => {
                        const cell = tr.insertCell();
                        const value = row[column] == null ? 'Not provided' : String(row[column]);
                        const params = body.plan?.params || {};
                        if (column === 'MEMBERID' && /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/.test(value)
                            && typeof params.branchCode === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(params.reportDate || '')) {
                            const memberButton = document.createElement('button');
                            memberButton.type = 'button'; memberButton.className = 'member-link';
                            memberButton.textContent = value;
                            memberButton.title = 'Prepare a loan inquiry for this member';
                            memberButton.addEventListener('click', () => {
                                if (form.elements.message.disabled) return;
                                form.elements.message.value = 'Show loan products, disbursed amounts, maturity dates, outstanding principal and overdue amounts for member '
                                    + value + ' in branch ' + params.branchCode + ' as of ' + params.reportDate + '.';
                                form.elements.message.focus();
                            });
                            cell.append(memberButton);
                        } else { cell.textContent = value; }
                    });
                });
                tableWrap.append(table); tableWrap.hidden = false; toolbar.hidden = false;
                searchCount.textContent = report.rows.length + ' displayed rows';
                result.textContent = body.summary || (typeof answer === 'string' ? answer.split('\n')[0] : 'Report returned.');
            }
            status.dataset.state = body.ok ? 'success' : (body.approval_required ? 'working' : 'error');
            status.textContent = body.ok ? (body.kind === 'clarification' ? 'More detail needed' : 'Response received') : (body.approval_required ? 'Approval required' : 'Request unsuccessful');
            clearInterval(clock);
            const info = [];
            if (report?.rows) info.push(report.rows.length+' displayed'+(report.truncated?' · More records available':''));
            if (report?.scope) info.push(report.scope);
            if (report?.order) info.push(report.order);
            if (body.duration_ms != null) info.push((body.duration_ms/1000).toFixed(1)+'s');
            if (body.request_id) info.push('Request '+body.request_id);
            details.textContent = info.join(' · ');
            copyButton.hidden = false; copyButton.textContent = 'Copy full answer';
        } catch(error) {
            status.dataset.state='error'; status.textContent='Response unavailable';
            result.textContent=error.message || 'The request could not be completed. Check the run log before retrying.';
            details.textContent='No automatic retry was sent. Check the run log before submitting again.';
        } finally {
            clearInterval(clock); button.disabled=false; form.elements.message.disabled=false;
            button.textContent='Ask assistant →'; panel.setAttribute('aria-busy','false');
        }
    });
})();
</script>
