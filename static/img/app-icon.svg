<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="50" y1="40" x2="460" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="45%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="card" x1="120" y1="90" x2="390" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <linearGradient id="heart" x1="210" y1="135" x2="310" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Soft NGO glow shapes -->
  <circle cx="92" cy="95" r="72" fill="#ffffff" opacity="0.12"/>
  <circle cx="430" cy="405" r="98" fill="#ffffff" opacity="0.10"/>
  <circle cx="410" cy="110" r="42" fill="#bbf7d0" opacity="0.28"/>

  <!-- Main white card -->
  <g filter="url(#shadow)">
    <rect x="88" y="78" width="336" height="330" rx="68" fill="url(#card)" opacity="0.98"/>

    <!-- People / community -->
    <circle cx="190" cy="165" r="34" fill="#0f766e"/>
    <circle cx="322" cy="165" r="34" fill="#2563eb"/>
    <circle cx="256" cy="138" r="39" fill="#0891b2"/>

    <path d="M132 270c13-45 45-70 82-70s69 25 82 70c4 15-7 29-23 29H155c-16 0-27-14-23-29z" fill="#0f766e" opacity="0.92"/>
    <path d="M216 265c12-48 49-78 93-78s81 30 93 78c4 16-8 31-25 31H241c-17 0-29-15-25-31z" fill="#2563eb" opacity="0.92"/>
    <path d="M170 255c15-55 50-86 86-86s71 31 86 86c5 17-8 33-26 33H196c-18 0-31-16-26-33z" fill="#0891b2"/>

    <!-- Heart symbol -->
    <path d="M256 240
             C238 218 207 197 207 164
             C207 139 225 122 248 122
             C262 122 274 129 282 141
             C290 129 302 122 316 122
             C339 122 357 139 357 164
             C357 197 326 218 308 240
             L282 269
             L256 240Z"
          fill="url(#heart)" opacity="0.96"/>

    <!-- Helping hands -->
    <path d="M138 330
             C176 302 214 306 249 331
             C259 338 270 338 280 331
             C315 306 353 302 391 330
             C363 371 313 390 256 390
             C199 390 166 371 138 330Z"
          fill="#ffffff" opacity="0.95"/>

    <path d="M138 330
             C176 302 214 306 249 331
             C259 338 270 338 280 331
             C315 306 353 302 391 330"
          fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" opacity="0.75"/>

    <!-- AI small badge -->
    <g filter="url(#soft)">
      <rect x="331" y="315" width="66" height="46" rx="23" fill="#1e3a8a"/>
      <text x="364" y="347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900" fill="#ffffff">
        AI
      </text>
    </g>
  </g>

  <!-- Brand text -->
  <text x="256" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#ffffff">
    Buro AI
  </text>

  <!-- Small subtitle dot line -->
  <circle cx="190" cy="482" r="5" fill="#bbf7d0"/>
  <circle cx="256" cy="482" r="5" fill="#ffffff"/>
  <circle cx="322" cy="482" r="5" fill="#bfdbfe"/>
</svg>
